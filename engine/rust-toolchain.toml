# Real pin (rustup honors this file). 1.86.0 is the version every result in
# docs/STATUS.md was produced with; clippy lints change between releases, so
# keep it pinned until you deliberately upgrade.
# First time on a machine:  cd engine && rustup toolchain install
[toolchain]
channel = "1.86.0"
profile = "minimal"
components = ["clippy", "rustfmt"]
targets = ["wasm32-unknown-unknown"]
